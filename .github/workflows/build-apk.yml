name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: apk-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 从 GitHub Secrets 还原签名密钥（仓库内不再存放明文 p12）
      - name: Restore signing key
        run: |
          echo "$SIGNING_KEY" | base64 -d > app/kidgame.p12
          ls -l app/kidgame.p12
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      # 计算版本号：每次构建递增 versionCode，保证覆盖安装（升级）不丢数据
      - name: Compute version
        id: ver
        run: |
          VC=$((1000 + GITHUB_RUN_NUMBER))
          VN="1.26.${GITHUB_RUN_NUMBER}"
          echo "versionCode=$VC" >> "$GITHUB_OUTPUT"
          echo "versionName=$VN" >> "$GITHUB_OUTPUT"
          echo "Building versionCode=$VC versionName=$VN"

      # 使用仓库自带的 gradle wrapper 构建（稳定、可复现）
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PversionCode=${{ steps.ver.outputs.versionCode }} -PversionName="${{ steps.ver.outputs.versionName }}" --no-daemon --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kidgame-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ github.run_number }}
          name: 萌娃闯关 v${{ github.run_number }}
          body: |
            自动构建的 Debug APK。
            - 覆盖安装即可升级，学习数据不会丢失。
            - versionCode ${{ steps.ver.outputs.versionCode }} / versionName ${{ steps.ver.outputs.versionName }}
          files: app/build/outputs/apk/debug/*.apk

      - name: Send APK via Lark (Feishu)
        if: success()
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_USER_ID: ${{ secrets.FEISHU_USER_ID }}
        run: |
          node -e "
          const fs = require('fs');
          const https = require('https');
          const path = require('path');

          const APK_PATH = 'app/build/outputs/apk/debug/app-debug.apk';
          const TOKEN_URL = 'https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal';
          const UPLOAD_URL = 'https://open.feishu.cn/open-apis/im/v1/files';
          const MSG_URL = 'https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=open_id';
          const USER_ID = process.env.FEISHU_USER_ID;
          const APP_ID = process.env.FEISHU_APP_ID;
          const APP_SECRET = process.env.FEISHU_APP_SECRET;

          function postJson(url, body, token) {
            return new Promise((resolve, reject) => {
              const urlObj = new URL(url);
              const bodyStr = JSON.stringify(body);
              const options = {
                hostname: urlObj.hostname,
                path: urlObj.pathname + urlObj.search,
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': 'Bearer ' + token,
                  'Content-Length': Buffer.byteLength(bodyStr)
                }
              };
              const req = https.request(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch { resolve(data); } });
              });
              req.on('error', reject);
              req.write(bodyStr);
              req.end();
            });
          }

          async function uploadFile(token, filePath) {
            const fileName = path.basename(filePath);
            const fileContent = fs.readFileSync(filePath);
            const boundary = '----LarkUpload' + Date.now();
            const parts = [];
            parts.push(Buffer.from('--' + boundary + '\\r\\nContent-Disposition: form-data; name=\"file_name\"\\r\\n\\r\\n' + fileName + '\\r\\n'));
            parts.push(Buffer.from('--' + boundary + '\\r\\nContent-Disposition: form-data; name=\"file_type\"\\r\\n\\r\\nstream\\r\\n'));
            const fileHeader = Buffer.from('--' + boundary + '\\r\\nContent-Disposition: form-data; name=\"file\"; filename=\"' + fileName + '\"\\r\\nContent-Type: application/octet-stream\\r\\n\\r\\n');
            const fileFooter = Buffer.from('\\r\\n--' + boundary + '--');
            const totalBody = Buffer.concat([...parts, fileHeader, fileContent, fileFooter]);
            return new Promise((resolve, reject) => {
              const urlObj = new URL(UPLOAD_URL);
              const options = {
                hostname: urlObj.hostname,
                path: urlObj.pathname,
                method: 'POST',
                headers: {
                  'Authorization': 'Bearer ' + token,
                  'Content-Type': 'multipart/form-data; boundary=' + boundary,
                  'Content-Length': totalBody.length
                }
              };
              const req = https.request(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch { resolve(data); } });
              });
              req.on('error', reject);
              req.write(totalBody);
              req.end();
            });
          }

          async function main() {
            const tokenRes = await postJson(TOKEN_URL, { app_id: APP_ID, app_secret: APP_SECRET });
            const token = tokenRes.tenant_access_token;
            console.log('Token:', token ? 'OK' : 'FAIL');
            const uploadRes = await uploadFile(token, APK_PATH);
            console.log('Upload:', JSON.stringify(uploadRes));
            if (uploadRes.code === 0) {
              const msgRes = await postJson(MSG_URL, {
                receive_id: USER_ID,
                msg_type: 'file',
                content: JSON.stringify({ file_key: uploadRes.data.file_key })
              }, token);
              console.log('Message:', JSON.stringify(msgRes));
            }
          }

          main().catch(console.error);
          "
